<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CircuBee Balance Challenge</title>
  <style>
    :root {
      --red: #d94b4b;
      --green: #2f9d68;
      --blue: #3978c9;
      --ink: #24303a;
      --muted: #66727d;
      --bg: #f5f7f8;
      --card: #fff;
      --line: #dfe5e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.45;
    }

    .wrap {
      max-width: 1050px;
      margin: auto;
      padding: 20px;
    }

    .hero {
      background: var(--ink);
      color: white;
      border-radius: 18px;
      padding: 28px;
      margin-bottom: 18px;
    }

    .hero h1 {
      margin: 4px 0;
      font-size: clamp(2rem, 5vw, 3rem);
    }

    .hero p {
      color: #dbe2e6;
    }

    .progress {
      display: flex;
      gap: 6px;
      margin-top: 16px;
    }

    .dot {
      height: 7px;
      flex: 1;
      background: #68747c;
      border-radius: 8px;
    }

    .dot.on {
      background: white;
    }

    .card {
      background: white;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 5px 18px #18242b0b;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .cat {
      border: 2px solid var(--line);
      border-radius: 13px;
      padding: 16px;
    }

    .red {
      border-color: #efb4b4;
    }

    .green {
      border-color: #a9d9c2;
    }

    .blue {
      border-color: #abc7ec;
    }

    .tokens {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      margin: 18px 0;
    }

    .token,
    .choice {
      border: 2px solid var(--line);
      background: white;
      border-radius: 12px;
      padding: 14px;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }

    .token small {
      display: block;
      color: var(--muted);
      margin-top: 4px;
    }

    .token.selected.red {
      border-color: var(--red);
      background: #fff3f3;
    }

    .token.selected.green {
      border-color: var(--green);
      background: #f0fbf5;
    }

    .token.selected.blue {
      border-color: var(--blue);
      background: #f1f6fd;
    }

    .choice {
      display: block;
      width: 100%;
      margin: 9px 0;
    }

    .choice.selected {
      border-color: var(--ink);
      background: #eef2f4;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      background: var(--ink);
      color: white;
    }

    .btn.secondary {
      background: #e8edef;
      color: var(--ink);
    }

    .btn:disabled {
      opacity: 0.4;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 20px;
    }

    .notice {
      background: #f0f4f5;
      border-radius: 11px;
      padding: 14px;
      margin: 15px 0;
    }

    .consent {
      background: #fff8e8;
      border: 1px solid #ead39b;
      border-radius: 12px;
      padding: 16px;
      margin: 18px 0;
    }

    .consent label {
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }

    .consent input {
      margin-top: 5px;
      width: 18px;
      height: 18px;
    }

    textarea {
      width: 100%;
      min-height: 110px;
      border: 2px solid var(--line);
      border-radius: 11px;
      padding: 12px;
      font: inherit;
    }

    .scale {
      display: grid;
      grid-template-columns: 1fr 100px 1fr;
      gap: 12px;
      align-items: center;
      text-align: center;
    }

    .pan {
      min-height: 140px;
      border: 2px dashed var(--line);
      border-radius: 14px;
      padding: 15px;
    }

    .beam {
      height: 8px;
      background: var(--ink);
      border-radius: 8px;
    }

    .score {
      font-size: 2.2rem;
      font-weight: 800;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .scale {
        grid-template-columns: 1fr;
      }

      .actions {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .wrap {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <b>CIRCUBEE</b>
      <h1>Balance Challenge</h1>
      <p>What would make a local business say YES to a circular rewards scheme?</p>
      <div class="progress" id="progress"></div>
    </section>
    <section id="app"></section>
  </main>

  <script src="app.js"></script>
</body>
</html>
