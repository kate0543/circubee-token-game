<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CircuBee Balance Challenge</title>
<style>
:root{--red:#d94b4b;--green:#2f9d68;--blue:#3978c9;--ink:#24303a;--muted:#66727d;--bg:#f5f7f8;--card:#fff;--line:#dfe5e8}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:var(--ink);color:white;border-radius:20px;padding:34px;margin-bottom:20px}.hero h1{font-size:clamp(2rem,5vw,3.4rem);margin:0 0 8px}.hero p{max-width:760px;margin:8px 0;color:#dbe2e6}.progress{display:flex;gap:8px;margin:18px 0}.dot{height:8px;flex:1;border-radius:8px;background:#dce2e5}.dot.on{background:#65737d}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;margin-bottom:18px;box-shadow:0 5px 20px #18242b0b}.hidden{display:none}.intro-grid,.tokens,.results{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.category{border:2px solid var(--line);border-radius:15px;padding:18px}.category.red{border-color:#efb4b4}.category.green{border-color:#a9d9c2}.category.blue{border-color:#abc7ec}.category h3{margin:0 0 6px}.token-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0}.token{border:2px solid var(--line);background:white;border-radius:14px;padding:15px;text-align:left;cursor:pointer;min-height:72px;font-weight:650}.token:hover{transform:translateY(-1px)}.token.selected.red{border-color:var(--red);background:#fff3f3}.token.selected.green{border-color:var(--green);background:#f0fbf5}.token.selected.blue{border-color:var(--blue);background:#f1f6fd}.token small{display:block;color:var(--muted);font-weight:400;margin-top:3px}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.btn{border:0;border-radius:11px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:white}.btn.secondary{background:#e8edef;color:var(--ink)}.btn:disabled{opacity:.4;cursor:not-allowed}.choice{display:block;width:100%;text-align:left;padding:15px;border:2px solid var(--line);background:white;border-radius:12px;margin:9px 0;cursor:pointer}.choice.selected{border-color:var(--ink);background:#eef2f4}.scale{display:grid;grid-template-columns:1fr 120px 1fr;gap:12px;align-items:center;text-align:center;margin:22px 0}.pan{min-height:150px;border-radius:15px;padding:14px;border:2px dashed var(--line)}.beam{height:8px;background:var(--ink);border-radius:8px}.score{font-size:2.4rem;font-weight:800}.summary{font-size:1.05rem}.notice{background:#f0f4f5;border-radius:12px;padding:14px;margin-top:15px;color:#45525c}textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:12px;padding:12px;font:inherit}h2{margin-top:0}@media(max-width:700px){.intro-grid,.tokens,.results{grid-template-columns:1fr}.scale{grid-template-columns:1fr}.wrap{padding:12px}.hero{padding:25px}.actions{flex-direction:column}.btn{width:100%}}
</style></head>
<body><main class="wrap">
<section class="hero"><div style="font-weight:800;letter-spacing:.05em">CIRCUBEE</div><h1>Balance Challenge</h1><p>What would make a local business say YES to a circular rewards scheme?</p><div class="progress" id="progress"></div></section>
<section id="app"></section>
</main>
<script>
const data={barriers:[['Cost','Financial cost of joining or operating'],['Staff time','Extra time required from staff'],['Training','Training or learning requirements'],['Technical complexity','Technology feels difficult to use'],['Customer resistance','Customers may not understand or use it'],['Lack of space','Limited physical space'],['Extra administration','Additional paperwork or admin'],['Setup effort','Effort required to get started']],benefits:[['More customers','Attract new or environmentally conscious customers'],['Cost savings','Reduce costs or waste'],['Sustainability reputation','Strengthen sustainability reputation'],['Customer loyalty','Encourage repeat customers'],['Community impact','Create positive local impact'],['Reduced waste','Reduce materials or waste'],['Differentiation','Stand out from competitors']],support:[['University support','Practical support from the university'],['Funding / grants','Financial help with implementation'],['Marketing toolkit','Ready-made promotional materials'],['Digital platform','A simple digital tool or app'],['Student ambassadors','Students helping with implementation'],['Training materials','Simple guidance and training'],['Technical support','Help with technology'],['Promotional materials','Physical materials for customers']]};
let step=0,selections={barriers:[],benefits:[],support:[]},weights={barriers:{},benefits:{},support:{}},decision='',magic='';
const titles=['Welcome','Barriers','Motivations & benefits','Enablers & support','Weight your priorities','Your decision','What would change your mind?','Summary'];
function progress(){document.getElementById('progress').innerHTML=titles.map((_,i)=>`<span class="dot ${i<=step?'on':''}"></span>`).join('')}
function render(){progress();const a=document.getElementById('app');if(step===0)return a.innerHTML=`<div class="card"><h2>Welcome</h2><p>This interactive game explores what would encourage or prevent a local business from participating in CircuBee.</p><div class="intro-grid"><div class="category red"><h3>🔴 Barriers</h3><p>What makes participation difficult?</p></div><div class="category green"><h3>🟢 Motivations</h3><p>Why would I want to participate?</p></div><div class="category blue"><h3>🔵 Enablers</h3><p>What would help me participate?</p></div></div><div class="notice"><b>How it works:</b> Choose your priorities, weigh their importance, make a participation decision, then identify what would change your mind.</div><div class="actions"><span></span><button class="btn" onclick="next()">Start the game</button></div></div>`;
if(step>=1&&step<=3){let key=['barriers','benefits','support'][step-1],label={barriers:'🔴 Barriers',benefits:'🟢 Motivations / Benefits',support:'🔵 Enablers / Support'}[key];return a.innerHTML=`<div class="card"><h2>${label}</h2><p>${key==='barriers'?'What makes participation difficult?':key==='benefits'?'What would make participation worthwhile?':'What would make participation easier or more achievable?'}</p><p><b>Choose up to 3.</b> Selected: ${selections[key].length}/3</p><div class="token-grid">${data[key].map((x,i)=>`<button class="token ${key==='barriers'?'red':key==='benefits'?'green':'blue'} ${selections[key].includes(i)?'selected':''}" onclick="toggle('${key}',${i})">${x[0]}<small>${x[1]}</small></button>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="prev()">Back</button><button class="btn" ${selections[key].length===0?'disabled':''} onclick="next()">Continue</button></div></div>`}
if(step===4){return a.innerHTML=`<div class="card"><h2>Weight your priorities</h2><p>Give each selected item a weight: <b>1 = useful, 2 = important, 3 = critical.</b></p>${['barriers','benefits','support'].map(key=>`<h3>${key==='barriers'?'🔴 Barriers':key==='benefits'?'🟢 Benefits':'🔵 Support'}</h3>${selections[key].map(i=>`<div class="choice"><b>${data[key][i][0]}</b><div>${[1,2,3].map(n=>`<button class="btn ${weights[key][i]===n?'':'secondary'}" style="margin:7px 4px 0 0" onclick="setWeight('${key}',${i},${n})">${n}</button>`).join('')}</div></div>`).join('')}`).join('')}<div class="actions"><button class="btn secondary" onclick="prev()">Back</button><button class="btn" onclick="next()">See your balance</button></div></div>`}
if(step===5){let r=score('barriers'),g=score('benefits')+score('support'),diff=g-r;return a.innerHTML=`<div class="card"><h2>Your balance</h2><div class="scale"><div class="pan"><h3>🔴 Barriers</h3><div class="score">${r}</div><small>points</small></div><div class="beam"></div><div class="pan"><h3>🟢 + 🔵 Benefits & Support</h3><div class="score">${g}</div><small>points</small></div></div><p style="text-align:center;font-weight:700">${diff>0?'Benefits and support currently outweigh the barriers.':diff<0?'The barriers currently outweigh the benefits and support.':'The balance is currently even.'}</p><div class="actions"><button class="btn secondary" onclick="prev()">Back</button><button class="btn" onclick="next()">Make my decision</button></div></div>`}
if(step===6)return a.innerHTML=`<div class="card"><h2>Would you participate?</h2><p>Based on what you have considered, how likely would you be to participate in a local circular rewards scheme?</p>${[['no','Definitely would not participate'],['probably-no','Probably would not participate'],['probably-yes','Probably would participate'],['yes','Definitely would participate']].map(x=>`<button class="choice ${decision===x[0]?'selected':''}" onclick="decision='${x[0]}';render()">${x[1]}</button>`).join('')}<div class="actions"><button class="btn secondary" onclick="prev()">Back</button><button class="btn" ${!decision?'disabled':''} onclick="next()">Continue</button></div></div>`;
if(step===7)return a.innerHTML=`<div class="card"><h2>What would change your mind?</h2><p>What is the single thing CircuBee could provide that would make you more likely to participate?</p><textarea id="magic" placeholder="Your answer..."></textarea><div class="actions"><button class="btn secondary" onclick="prev()">Back</button><button class="btn" onclick="next();magic=document.getElementById('magic')?.value||magic">Finish</button></div></div>`;
if(step===8){let all=[...selections.barriers.map(i=>'🔴 '+data.barriers[i][0]),...selections.benefits.map(i=>'🟢 '+data.benefits[i][0]),...selections.support.map(i=>'🔵 '+data.support[i][0])];return a.innerHTML=`<div class="card"><h2>Thank you</h2><p>Your CircuBee Balance Challenge is complete.</p><div class="results"><div class="category red"><h3>Barriers</h3><p>${selections.barriers.map(i=>data.barriers[i][0]).join(', ')||'None'}</p></div><div class="category green"><h3>Benefits</h3><p>${selections.benefits.map(i=>data.benefits[i][0]).join(', ')||'None'}</p></div><div class="category blue"><h3>Support</h3><p>${selections.support.map(i=>data.support[i][0]).join(', ')||'None'}</p></div></div><div class="notice"><b>Participation:</b> ${decisionLabel()}<br><b>Your additional idea:</b> ${magic||'No response provided.'}</div><div class="actions"><button class="btn secondary" onclick="downloadResults()">Download my responses</button><button class="btn" onclick="location.reload()">Play again</button></div></div>`}
}
function toggle(key,i){let a=selections[key],p=a.indexOf(i);if(p>-1)a.splice(p,1);else if(a.length<3)a.push(i);render()}function setWeight(k,i,n){weights[k][i]=n;render()}function score(k){return selections[k].reduce((s,i)=>s+(weights[k][i]||1),0)}function decisionLabel(){return {no:'Definitely would not participate','probably-no':'Probably would not participate','probably-yes':'Probably would participate',yes:'Definitely would participate'}[decision]||'Not selected'}function next(){if(step===7){magic=document.getElementById('magic')?.value||magic}step++;render()}function prev(){step--;render()}function downloadResults(){const out={timestamp:new Date().toISOString(),barriers:selections.barriers.map(i=>({item:data.barriers[i][0],weight:weights.barriers[i]||1})),benefits:selections.benefits.map(i=>({item:data.benefits[i][0],weight:weights.benefits[i]||1})),support:selections.support.map(i=>({item:data.support[i][0],weight:weights.support[i]||1})),decision:decisionLabel(),additional_response:magic};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='circubee-response.json';a.click();URL.revokeObjectURL(u)}render();
</script></body></html>
