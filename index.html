<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CircuBee Balance Challenge</title>
<style>
:root{--red:#d94b4b;--green:#2f9d68;--blue:#3978c9;--ink:#24303a;--muted:#66727d;--bg:#f5f7f8;--card:#fff;--line:#dfe5e8}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}.wrap{max-width:1050px;margin:auto;padding:20px}.hero{background:var(--ink);color:white;border-radius:18px;padding:28px;margin-bottom:18px}.hero h1{margin:4px 0;font-size:clamp(2rem,5vw,3rem)}.hero p{color:#dbe2e6}.progress{display:flex;gap:6px;margin-top:16px}.dot{height:7px;flex:1;background:#68747c;border-radius:8px}.dot.on{background:white}.card{background:white;border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 5px 18px #18242b0b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cat{border:2px solid var(--line);border-radius:13px;padding:16px}.red{border-color:#efb4b4}.green{border-color:#a9d9c2}.blue{border-color:#abc7ec}.tokens{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:18px 0}.token,.choice{border:2px solid var(--line);background:white;border-radius:12px;padding:14px;text-align:left;cursor:pointer;font:inherit}.token small{display:block;color:var(--muted);margin-top:4px}.token.selected.red{border-color:var(--red);background:#fff3f3}.token.selected.green{border-color:var(--green);background:#f0fbf5}.token.selected.blue{border-color:var(--blue);background:#f1f6fd}.choice{display:block;width:100%;margin:9px 0}.choice.selected{border-color:var(--ink);background:#eef2f4}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:white}.btn.secondary{background:#e8edef;color:var(--ink)}.btn:disabled{opacity:.4}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}.notice{background:#f0f4f5;border-radius:11px;padding:14px;margin:15px 0}.consent{background:#fff8e8;border:1px solid #ead39b;border-radius:12px;padding:16px;margin:18px 0}.consent label{display:flex;gap:10px;align-items:flex-start}.consent input{margin-top:5px;width:18px;height:18px}textarea{width:100%;min-height:110px;border:2px solid var(--line);border-radius:11px;padding:12px;font:inherit}.scale{display:grid;grid-template-columns:1fr 100px 1fr;gap:12px;align-items:center;text-align:center}.pan{min-height:140px;border:2px dashed var(--line);border-radius:14px;padding:15px}.beam{height:8px;background:var(--ink);border-radius:8px}.score{font-size:2.2rem;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}.scale{grid-template-columns:1fr}.actions{flex-direction:column}.btn{width:100%}.wrap{padding:12px}}
</style></head>
<body><main class="wrap"><section class="hero"><b>CIRCUBEE</b><h1>Balance Challenge</h1><p>What would make a local business say YES to a circular rewards scheme?</p><div class="progress" id="progress"></div></section><section id="app"></section></main>
<script>
const data={barriers:[['Cost','Financial cost of joining or operating'],['Staff time','Extra time required from staff'],['Training','Training or learning requirements'],['Technical complexity','Technology feels difficult to use'],['Customer resistance','Customers may not understand or use it'],['Lack of space','Limited physical space'],['Extra administration','Additional paperwork or admin'],['Setup effort','Effort required to get started']],benefits:[['More customers','Attract new or environmentally conscious customers'],['Cost savings','Reduce costs or waste'],['Sustainability reputation','Strengthen sustainability reputation'],['Customer loyalty','Encourage repeat customers'],['Community impact','Create positive local impact'],['Reduced waste','Reduce materials or waste'],['Differentiation','Stand out from competitors']],support:[['University support','Practical support from the university'],['Funding / grants','Financial help with implementation'],['Marketing toolkit','Ready-made promotional materials'],['Digital platform','A simple digital tool or app'],['Student ambassadors','Students helping with implementation'],['Training materials','Simple guidance and training'],['Technical support','Help with technology'],['Promotional materials','Physical materials for customers']]};
let step=0,consent=false,selections={barriers:[],benefits:[],support:[]},weights={barriers:{},benefits:{},support:{}},decision='',magic='';
const titles=['Consent','Barriers','Benefits','Support','Weight','Balance','Decision','Your view','Summary'];
function progress(){document.getElementById('progress').innerHTML=titles.map((_,i)=>`<span class="dot ${i<=step?'on':''}></span>`).join('')}
function render(){progress();const a=document.getElementById('app');if(step===0)return a.innerHTML=`<div class="card"><h2>Before you start</h2><p>This short activity explores what would encourage or prevent a local business from participating in a circular rewards scheme called CircuBee.</p><div class="notice"><b>What will be collected?</b><br>Your choices in the game, the importance you give them, your participation decision, and any optional written response. Please do not enter names, contact details, confidential business information or other personal information.</div><div class="notice"><b>How will your answers be used?</b><br>If you agree below, your answers may be used as anonymised/aggregated preliminary research evidence to help develop the CircuBee project, future funding applications, publications and a potential pilot. Taking part is voluntary. You can use the game without agreeing to share your answers for research.</div><div class="consent"><label><input type="checkbox" ${consent?'checked':''} onchange="consent=this.checked;render()"><span><b>I agree to share my answers for the research purposes described above.</b><br><small>If you do not tick this box, your answers will not be treated as research data and the activity can still be completed for engagement purposes.</small></span></label></div><div class="actions"><span></span><button class="btn" onclick="start()">${consent?'Agree & start':'Start without sharing research data'}</button></div></div>`;
if(step>=1&&step<=3){const key=['barriers','benefits','support'][step-1],head={barriers:'🔴 Barriers',benefits:'🟢 Motivations / Benefits',support:'🔵 Enablers / Support'}[key],q={barriers:'What makes participation difficult?',benefits:'What would make participation worthwhile?',support:'What would make participation easier or more achievable?'}[key];return a.innerHTML=`<div class="card"><h2>${head}</h2><p>${q}</p><p><b>Choose up to 3.</b> Selected: ${selections[key].length}/3</p><div class="tokens">${data[key].map((x,i)=>`<button class="token ${key==='barriers'?'red':key==='benefits'?'green':'blue'} ${selections[key].includes(i)?'selected':''}" onclick="toggle('${key}',${i})">${x[0]}<small>${x[1]}</small></button>`).join('')}</div><div class="actions"><button class="btn secondary" onclick="prev()">Back</button><button class="btn" ${!selections[key].length?'disabled':''} onclick="next()">Continue</button></div></div>`}
if(step===4)return a.innerHTML=`<div class="card"><h2>Weight your priorities</h2><p>Give each selected item a weight: <b>1 = useful, 2 = important, 3 = critical.</b></p>${['barriers','benefits','support'].map(k=>`<h3>${k==='barriers'?'🔴 Barriers':k==='benefits'?'🟢 Benefits':'🔵 Support'}</h3>${selections[k].map(i=>`<div class="choice"><b>${data[k][i][0]}</b><div>${[1,2,3].map(n=>`<button class="btn ${weights[k][i]===n?'':'secondary'}" style="margin:6px 4px 0 0" onclick="setWeight('${k}',${i},${n})">${n}</button>`).join('')}</div></div>`).join('')}`).join('')}<div class="actions"><button class="btn secondary" onclick="prev()">Back</button><button class="btn" onclick="next()">See my balance</button></div></div>`;
if(step===5){let r=score('barriers'),g=score('benefits')+score('support'),d=g-r;return a.innerHTML=`<div class="card"><h2>Your balance</h2><div class="scale"><div class="pan"><h3>🔴 Barriers</h3><div class="score">${r}</div><small>points</small></div><div class="beam"></div><div class="pan"><h3>🟢 + 🔵 Benefits & Support</h3><div class="score">${g}</div><small>points</small></div></div><p style="text-align:center;font-weight:700">${d>0?'Benefits and support outweigh the barriers.':d<0?'The barriers outweigh the benefits and support.':'The balance is even.'}</p><div class="actions"><button class="btn secondary" onclick="prev()">Back</button><button class="btn" onclick="next()">Continue</button></div></div>`}
if(step===6)return a.innerHTML=`<div class="card"><h2>Would you participate?</h2><p>How likely would you be to participate in a local circular rewards scheme?</p>${[['no','Definitely would not participate'],['probably-no','Probably would not participate'],['probably-yes','Probably would participate'],['yes','Definitely would participate']].map(x=>`<button class="choice ${decision===x[0]?'selected':''}" onclick="decision='${x[0]}';render()">${x[1]}</button>`).join('')}<div class="actions"><button class="btn secondary" onclick="prev()">Back</button><button class="btn" ${!decision?'disabled':''} onclick="next()">Continue</button></div></div>`;
if(step===7)return a.innerHTML=`<div class="card"><h2>What would change your mind?</h2><p>What is the single thing CircuBee could provide that would make you more likely to participate?</p><textarea id="magic" placeholder="Optional response"></textarea><div class="actions"><button class="btn secondary" onclick="prev()">Back</button><button class="btn" onclick="magic=document.getElementById('magic').value;next()">Finish</button></div></div>`;
if(step===8)return a.innerHTML=`<div class="card"><h2>Thank you</h2><p>Your Balance Challenge is complete.</p><div class="grid"><div class="cat red"><h3>Barriers</h3><p>${selections.barriers.map(i=>data.barriers[i][0]).join(', ')||'None'}</p></div><div class="cat green"><h3>Benefits</h3><p>${selections.benefits.map(i=>data.benefits[i][0]).join(', ')||'None'}</p></div><div class="cat blue"><h3>Support</h3><p>${selections.support.map(i=>data.support[i][0]).join(', ')||'None'}</p></div></div><div class="notice"><b>Participation:</b> ${decisionLabel()}<br><b>Research sharing:</b> ${consent?'Agreed':'Not agreed'}<br><b>Your additional idea:</b> ${magic||'None provided'}</div>${consent?'<div class="notice"><b>Research data note:</b> This prototype currently prepares an anonymous response record for download. It does not send your answers to GitHub. Automatic secure research-data submission will only be enabled after the data storage and ethics arrangements have been finalised.</div>':''}<div class="actions"><button class="btn secondary" onclick="downloadResults()">Download my response</button><button class="btn" onclick="location.reload()">Play again</button></div></div>`}
function start(){step=1;render()}function toggle(k,i){let a=selections[k],p=a.indexOf(i);if(p>-1)a.splice(p,1);else if(a.length<3)a.push(i);render()}function setWeight(k,i,n){weights[k][i]=n;render()}function score(k){return selections[k].reduce((s,i)=>s+(weights[k][i]||1),0)}function decisionLabel(){return {no:'Definitely would not participate','probably-no':'Probably would not participate','probably-yes':'Probably would participate',yes:'Definitely would participate'}[decision]||'Not selected'}function next(){step++;render()}function prev(){step--;render()}function downloadResults(){const out={record_id:crypto.randomUUID(),timestamp:new Date().toISOString(),research_consent:consent,barriers:selections.barriers.map(i=>({item:data.barriers[i][0],weight:weights.barriers[i]||1})),benefits:selections.benefits.map(i=>({item:data.benefits[i][0],weight:weights.benefits[i]||1})),support:selections.support.map(i=>({item:data.support[i][0],weight:weights.support[i]||1})),decision:decisionLabel(),additional_response:magic};const text=JSON.stringify(out,null,2);const blob=new Blob([text],{type:'text/plain'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='circubee-response-'+Date.now()+'.txt';a.click();URL.revokeObjectURL(u)}render();
</script></body></html>
